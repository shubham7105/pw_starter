name: PR static checks (typecheck + lint)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  lint-and-typecheck:
    name: ESLint + tsc --noEmit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  code-review:
    name: Code review (CODE_REVIEW_GUIDELINES.md)
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Run Claude code review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE: origin/${{ github.event.pull_request.base.ref }}

            Follow the workflow in .claude/skills/pr-code-review/SKILL.md to review this PR
            (diff: `git diff origin/${{ github.event.pull_request.base.ref }}...HEAD`).
            Read CODE_REVIEW_GUIDELINES.md first, in full.

            Write the review to ./review.json (Write tool), using the skill's checklist and
            severities, but in this exact JSON shape instead of its usual markdown output:
            {"summary": "<markdown>", "comments": [{"path": "<file>", "line": <int>, "severity": "Blocker|Major|Minor|Suggestion", "section": "§N or —", "body": "<issue — fix>"}]}

            Rules:
            - One entry in "comments" per finding that maps to a specific line. "line" must be a line
              added or changed in the PR head (right side of the diff), 1-indexed in the new file.
            - Findings with no single line (risk triage, coverage gaps, cross-file issues) go in
              "summary", not "comments".
            - "summary" markdown format:
              ## Summary
              Overall Risk: Low | Medium | High
              ## Human Review Required
              **Required:** Yes/No — **Level:** Low/Medium/High — **Reason:** ...
              End with:
              checklist: CODE_REVIEW_GUIDELINES.md

            Do NOT post anything to GitHub yourself — a later step posts ./review.json as an inline
            PR review.
          claude_args: >-
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git status:*),Bash(git log:*),Write"

      - name: Post inline review
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ ! -s review.json ] || ! jq -e '(.summary | type == "string") and (.comments | type == "array")' review.json > /dev/null 2>&1; then
            gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} \
              --body "pr-code-review: the review step did not produce valid output (check the workflow run log)."
            exit 0
          fi
          api="repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews"
          jq --arg sha "$SHA" '{
            commit_id: $sha, event: "COMMENT", body: .summary,
            comments: [.comments[] | {path, line, side: "RIGHT",
              body: ("**" + .severity + "**" + (if (.section // "—") != "—" then " (" + .section + ")" else "" end) + " — " + .body)}]
          }' review.json > payload.json
          if ! gh api "$api" --input payload.json > /dev/null; then
            echo "::warning::Inline post rejected (line not in diff?); falling back to a single summary review."
            jq --arg sha "$SHA" '{
              commit_id: $sha, event: "COMMENT",
              body: (.summary + "\n\n## Findings\n" + ([.comments[] | "- `\(.path):\(.line)` **\(.severity)** \(.section // "—") — \(.body)"] | join("\n")))
            }' review.json > fallback.json
            gh api "$api" --input fallback.json > /dev/null
          fi
